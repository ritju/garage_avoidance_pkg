compute_right_edge_path_action_server:
  ros__parameters:
    path_topic_name: "garage_path"
    dis_thr: 4.0
    test: false
    robot_x_test: -1.0
    robot_y_test: 21.5
    strict_mode: true    #删除距离车子更近的危险路径
    offset_min: 0.7      #底盘参考点距右侧边的最小偏移，米
    offset_max: 4.0      #最大偏移，米
    offset_step: 0.5     #横向每次尝试增加的距离，米
    resolution: 1.0      #path中点与点之间的距离，单位米
    allow_inverse: True #是否允许生成相反方向的路径，主要用于机器人无法调头的情况。

test_compute_right_edge_path:
  ros__parameters:
    car_pose_x: 2.0
    car_pose_y: 21.5